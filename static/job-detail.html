<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="/static/css/style.css?v=5" />
  <link rel="stylesheet" href="/static/css/public.css?v=1" />
</head>
<body>

<header class="public-header">
  <div class="public-header-inner">
    <a href="/jobs" class="sidebar-brand" style="color:inherit">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="brand-text">Careers</span>
    </a>
    <a href="/jobs" class="btn btn-ghost btn-sm">← All Jobs</a>
  </div>
</header>

<main class="public-container public-container-narrow" id="job-detail">
  <p class="loading">Loading job…</p>
</main>

<!-- ─── Apply Modal ───────────────────────────────────────────────────────── -->
<div id="apply-modal" class="modal-overlay" style="display:none">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3 id="apply-modal-title">Apply for this role</h3>
      <button class="modal-close" onclick="hidePublicModal('apply-modal')">
        <svg viewBox="0 0 24 24" fill="none" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="apply-form-wrap" style="padding:20px 24px 0">
      <div class="form-row">
        <label class="form-label">
          <span class="form-label-text">Full Name</span>
          <input id="apply-name" type="text" class="form-input" placeholder="Jane Doe" />
        </label>
        <label class="form-label">
          <span class="form-label-text">Email Address</span>
          <input id="apply-email" type="email" class="form-input" placeholder="jane@example.com" />
        </label>
      </div>
      <label class="form-label">
        <span class="form-label-text">Phone Number</span>
        <input id="apply-phone" type="tel" class="form-input" placeholder="+92 300 1234567" />
      </label>
      <label class="form-label">
        <span class="form-label-text">Resume</span>
      </label>
      <label class="file-drop-zone" id="apply-drop-zone">
        <input type="file" id="apply-file" accept=".pdf,.docx,.txt" style="display:none" />
        <div class="drop-icon">
          <svg viewBox="0 0 24 24" fill="none" width="30" height="30">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.75"/>
            <polyline points="14 2 14 8 20 8" stroke="currentColor" stroke-width="1.75"/>
            <line x1="12" y1="18" x2="12" y2="12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            <line x1="9" y1="15" x2="15" y2="15" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          </svg>
        </div>
        <span id="apply-file-name">Drag & drop or <u>browse</u></span>
        <span class="drop-hint">PDF, DOCX, TXT supported</span>
      </label>
    </div>

    <div id="apply-success" style="display:none;padding:32px 24px;text-align:center">
      <div class="apply-success-icon">
        <svg viewBox="0 0 24 24" fill="none" width="40" height="40"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="1.75"/><polyline points="22 4 12 14.01 9 11.01" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h3 style="margin:14px 0 6px">Application received!</h3>
      <p style="color:var(--t2)">Thanks for applying — our team will review your application and reach out if there's a match.</p>
    </div>

    <div class="modal-footer" id="apply-modal-footer">
      <button class="btn btn-ghost" onclick="hidePublicModal('apply-modal')">Cancel</button>
      <button class="btn btn-primary" id="apply-submit-btn" onclick="submitApplication()">Submit Application</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script src="/static/js/public.js"></script>
<script>
  loadJobDetail();
</script>
</body>
</html>
